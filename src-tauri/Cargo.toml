[package]
name = "agent-panel"
version = "0.1.0"
edition = "2024"

[lib]
name = "agent_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agent-panel"
path = "src/main.rs"

[[bin]]
name = "agent-panel-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v5"] }
sha2 = "0.10"
toml = "0.9"
